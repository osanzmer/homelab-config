services:
  broker:
    image: redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASS}
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
  tika:
    image: apache/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    container_name: paperless
    restart: unless-stopped
    depends_on: [db, broker, gotenberg, tika]
    volumes:
      - ./data:/usr/src/paperless/data
      - /data/documentos/archivo:/usr/src/paperless/media
      - /data/documentos/consumo:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${DB_PASS}
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_URL: https://docs.home.lab
      PAPERLESS_TIME_ZONE: Europe/Madrid
      PAPERLESS_OCR_LANGUAGE: spa+eng
      PAPERLESS_OCR_LANGUAGES: spa
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_OCR_IMAGE_DPI: "300"
      PAPERLESS_CONSUMER_POLLING: "30"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
    networks: [default, homelab]
networks:
  homelab:
    external: true
    name: homelab_default
