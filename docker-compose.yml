x-common: &common
  restart: unless-stopped
  environment:
    PUID: 1000
    PGID: 1000
    TZ: Europe/Madrid

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      LANGS: "es_ES"
    volumes:
      - ./config/stirling/tessdata:/usr/share/tessdata
      - ./config/stirling/configs:/configs
    restart: unless-stopped
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      SEARXNG_BASE_URL: "https://find.home.lab/"
    volumes:
      - ./config/searxng:/etc/searxng
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    volumes:
      - ./config/changedetection:/datastore
    restart: unless-stopped
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin@sha256:38f6ad3bcd487c82933ede7e32d74ab8712fffcff9e87b16dd2e245ab37130f8
    container_name: jellyfin
    tmpfs:
      - /transcodes:size=4G
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./config/jellyfin:/config
      - /data/media:/data/media:ro
    ports:
      - "8096:8096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    volumes:
      - ./config/qbittorrent:/config
      - /data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - /data:/data
    ports:
      - "127.0.0.1:8989:8989"

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - /data:/data
    ports:
      - "127.0.0.1:7878:7878"

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - "3001:3001"
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TZ: "Europe/Madrid"
    volumes:
      - ./config/backrest/data:/data
      - ./config/backrest/config:/config
      - ./config/backrest/cache:/cache
      - /srv/restic:/repos/principal
      - /data/backups/restic-copia:/repos/copia
      - /data/restaurado:/restaurado
    restart: unless-stopped
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - ./config/mylar3:/config
      - /data/comics:/comics
      - /data:/data
    restart: unless-stopped

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - ./config/lazylibrarian:/config
      - /data/libros:/books
      - /data:/data
    restart: unless-stopped
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    environment:
      TZ: "Europe/Madrid"
    volumes:
      - ./config/kavita:/kavita/config
      - /data/comics:/comics
      - /data/libros:/libros
    restart: unless-stopped
  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    network_mode: host
    volumes:
      - ./config/rustdesk:/root
    restart: unless-stopped
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs
    network_mode: host
    volumes:
      - ./config/rustdesk:/root
    depends_on:
      - rustdesk-hbbr
    restart: unless-stopped
  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    environment:
      TZ: "Europe/Madrid"
      DIUN_WATCH_SCHEDULE: "0 9 * * 6"
      DIUN_WATCH_WORKERS: "10"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_NTFY_ENDPOINT: "https://ntfy.sh"
      DIUN_NOTIF_NTFY_TOPIC: "${NTFY_INFO}"
    volumes:
      - ./config/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
    volumes:
      - ./config/bazarr:/config
      - /data/media:/data/media
    ports:
      - "127.0.0.1:6767:6767"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Madrid
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
    volumes:
      - /data:/data

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Madrid
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - /run/udev:/run/udev:ro
      - ./config/scrutiny:/opt/scrutiny/config
      - ./config/scrutiny/influxdb:/opt/scrutiny/influxdb
    ports:
      - "127.0.0.1:8090:8080"
    devices:
      - /dev/sda
      - /dev/sdb

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.74:3002,100.124.174.116:3002,dashboard.home.lab,homepage:3000,homepage:3000
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3002:3000"

  caddy:
    image: caddy:2.11.9
    container_name: caddy
    labels:
      - 'diun.watch_repo=true'
      - 'diun.include_tags=^2\.\d+\.\d+$$'
      - 'diun.max_tags=3'
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/conf:/etc/caddy:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    volumes:
      - ./config/beszel:/beszel_data
    ports:
      - "127.0.0.1:8091:8090"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0
    container_name: homeassistant
    labels:
      - 'diun.watch_repo=true'
      - 'diun.include_tags=^\d{4}\.\d+\.\d+$$'
      - 'diun.max_tags=3'
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/homeassistant:/config
      - /run/dbus:/run/dbus:ro

  whisper:
    <<: *common
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: whisper
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      WHISPER_MODEL: base-int8
      WHISPER_LANG: es
    volumes:
      - ./config/whisper:/config
    ports:
      - "127.0.0.1:10300:10300"

  piper:
    <<: *common
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PIPER_VOICE: es_ES-davefx-medium
    volumes:
      - ./config/piper:/config
    ports:
      - "127.0.0.1:10200:10200"
