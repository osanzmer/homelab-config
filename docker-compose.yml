x-common: &common
  restart: unless-stopped
  environment:
    PUID: 1000
    PGID: 1000
    TZ: Europe/Madrid

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin@sha256:38f6ad3bcd487c82933ede7e32d74ab8712fffcff9e87b16dd2e245ab37130f8
    container_name: jellyfin
    tmpfs:
      - /transcodes:size=4G
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./config/jellyfin:/config
      - /data/media:/data/media:ro
    ports:
      - "8096:8096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    volumes:
      - ./config/qbittorrent:/config
      - /data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - /data:/data
    ports:
      - "127.0.0.1:8989:8989"

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - /data:/data
    ports:
      - "127.0.0.1:7878:7878"

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - "3001:3001"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
    volumes:
      - ./config/bazarr:/config
      - /data/media:/data/media
    ports:
      - "127.0.0.1:6767:6767"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
    volumes:
      - ./config/lidarr:/config
      - /data:/data
    ports:
      - "127.0.0.1:8686:8686"

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Madrid
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
    volumes:
      - /data:/data

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Madrid
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_SCHEDULE: "0 0 9 * * 6"
      WATCHTOWER_NOTIFICATION_URL: "ntfy://ntfy.sh/TU-TEMA"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - /run/udev:/run/udev:ro
      - ./config/scrutiny:/opt/scrutiny/config
      - ./config/scrutiny/influxdb:/opt/scrutiny/influxdb
    ports:
      - "127.0.0.1:8090:8080"
    devices:
      - /dev/sda
      - /dev/sdb

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
    volumes:
      - ./config/wizarr:/data/database
    ports:
      - "5690:5690"

  jellystat-db:
    image: postgres:15
    container_name: jellystat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jfstat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASS}
    volumes:
      - ./config/jellystat/db:/var/lib/postgresql/data

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASS}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JELLYSTAT_JWT}
      TZ: Europe/Madrid
    volumes:
      - ./config/jellystat/backup:/app/backend/backup-data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - jellystat-db

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.74:3002,100.124.174.116:3002,inicio.fortress.lan,homepage:3000,homepage:3000
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3002:3000"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    volumes:
      - ./config/beszel:/beszel_data
    ports:
      - "127.0.0.1:8091:8090"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/homeassistant:/config
      - /run/dbus:/run/dbus:ro

  whisper:
    <<: *common
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: whisper
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      WHISPER_MODEL: base-int8
      WHISPER_LANG: es
    volumes:
      - ./config/whisper:/config
    ports:
      - "127.0.0.1:10300:10300"

  piper:
    <<: *common
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PIPER_VOICE: es_ES-davefx-medium
    volumes:
      - ./config/piper:/config
    ports:
      - "127.0.0.1:10200:10200"
